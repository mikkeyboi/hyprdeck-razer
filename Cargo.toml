[package]
name = "hyprdeck-razer"
version = "0.4.0"
edition = "2024"
license = "MIT"
description = "Standalone Hyprdeck Razer product controls and read-only native input diagnostics"
repository = "https://github.com/mikkeyboi/hyprdeck-razer"
publish = false

[dependencies]
anyhow = "1"
evdev = "0.13"
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
futures-util = "0.3"
roxmltree = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "process"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
